name: Update Quantified Self Only

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of past days to include in quantified self (default: 730)'
        required: false
        default: '730'

jobs:
  update-quantified-self:
    runs-on: ubuntu-latest
    env:
      DAYS_TO_SYNC: ${{ inputs.days || '730' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_DRIVE_CREDENTIALS }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r garmin/requirements.txt

      - name: Generate Quantified Self CSV
        run: |
          python generate_quantified_self.py
