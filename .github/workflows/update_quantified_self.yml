name: Update Quantified Self Dataset

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  update-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f garmin/requirements.txt ]; then pip install -r garmin/requirements.txt; fi

      - name: Generate Quantified Self Dataset
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python generate_quantified_self.py
