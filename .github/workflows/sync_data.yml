name: Sync Health Data

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to sync'
        required: false
        default: '7'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r garmin/requirements.txt
          pip install gspread oauth2client pandas python-dotenv

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: |
          cd withings
          npm ci || npm install

      - name: Sync Garmin Data
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SPREADSHEET_KEY: ${{ secrets.GOOGLE_SPREADSHEET_KEY }}
          DAYS_TO_SYNC: ${{ github.event.inputs.days || '7' }}
          DAYS: ${{ github.event.inputs.days || '7' }}
        run: |
          python -m garmin.sync_garmin "${{ github.event.inputs.days || '7' }}"

      - name: Sync Withings Data
        env:
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_REFRESH_TOKEN: ${{ secrets.WITHINGS_REFRESH_TOKEN }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SPREADSHEET_KEY: ${{ secrets.GOOGLE_SPREADSHEET_KEY }}
          DAYS_TO_SYNC: ${{ github.event.inputs.days || '7' }}
          DAYS: ${{ github.event.inputs.days || '7' }}
        run: |
          cd withings
          node index.js "${{ github.event.inputs.days || '7' }}"

      - name: Generate Quantified Self
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SPREADSHEET_KEY: ${{ secrets.GOOGLE_SPREADSHEET_KEY }}
          DAYS_TO_SYNC: ${{ github.event.inputs.days || '7' }}
          DAYS: ${{ github.event.inputs.days || '7' }}
        run: |
          python generate_quantified_self.py "${{ github.event.inputs.days || '7' }}"
